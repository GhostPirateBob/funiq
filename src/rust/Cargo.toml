[package]
name = "funiq-rs"
version = "1.2.0"
edition = "2024"
description = "Rust port of funiq (fuzzy uniq) for benchmarking against the C++ original"
license = "MIT"
publish = false

[[bin]]
name = "funiq-rs"
path = "src/main.rs"

[dependencies]
rayon = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
